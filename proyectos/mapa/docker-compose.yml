version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gastro
      POSTGRES_PASSWORD: gastro123
      POSTGRES_DB: gastro_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:./backend
    env_file:./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      -./backend:/app
volumes:
  pgdata:
