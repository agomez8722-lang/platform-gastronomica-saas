services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mapa
      POSTGRES_USER: mapa
      POSTGRES_PASSWORD: mapa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    command: gunicorn -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 backend.app:app

volumes:
  pgdata:
