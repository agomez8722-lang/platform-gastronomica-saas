services:
  backend-ia:
    build:./backend
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/app"
      - "./backend/pedidos.db:/app/pedidos.db"
    environment:
      - PYTHONUNBUFFERED=1
    command: python3 -m uvicorn app:app --host 0.0.0.0 --port 8000 --reload
  saas-api:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - "./platform-gastronomica-saas:/app"
      - "./platform-gastronomica-saas/node_modules:/app/node_modules"
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0 --port 3001"
  kds-front:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - "./platform-gastronomica-saas:/app"
      - "./platform-gastronomica-saas/node_modules:/app/node_modules"
    command: sh -c "npx vite --host 0.0.0.0 --port 5173"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
